[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false


###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################
# Read metrics about system CPU usage
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false


###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"
